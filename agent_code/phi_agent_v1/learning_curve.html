function drawChart(canvasId, datasets, yLabel, yMin, yMax) {
  const canvas = document.getElementById(canvasId);
  const ctx = canvas.getContext('2d');
  const W = canvas.offsetWidth;
  const H = canvas.offsetHeight || parseInt(canvas.getAttribute('height'));
  canvas.width = W;
  canvas.height = H;

  const pad = { top: 20, right: 20, bottom: 40, left: 50 };
  const cW = W - pad.left - pad.right;
  const cH = H - pad.top - pad.bottom;

  const xScale = x => pad.left + (x / 1501) * cW;
  const yScale = y => pad.top + cH - ((y - yMin) / (yMax - yMin)) * cH;

  // grid
  ctx.strokeStyle = '#2a2a4a';
  ctx.lineWidth = 1;
  for (let i = 0; i <= 5; i++) {
    const y = yMin + (yMax - yMin) * i / 5;
    const py = yScale(y);
    ctx.beginPath(); ctx.moveTo(pad.left, py); ctx.lineTo(pad.left + cW, py); ctx.stroke();
    ctx.fillStyle = '#888'; ctx.font = '11px sans-serif'; ctx.textAlign = 'right';
    ctx.fillText(Math.round(y), pad.left - 6, py + 4);
  }
  for (let r = 0; r <= 1500; r += 300) {
    const px = xScale(r);
    ctx.beginPath(); ctx.moveTo(px, pad.top); ctx.lineTo(px, pad.top + cH); ctx.stroke();
    ctx.fillStyle = '#888'; ctx.textAlign = 'center';
    ctx.fillText(r, px, pad.top + cH + 20);
  }

  // axes label
  ctx.fillStyle = '#aaa'; ctx.font = '12px sans-serif'; ctx.textAlign = 'center';
  ctx.fillText('Round', pad.left + cW / 2, H - 4);

  datasets.forEach(({ data, color, alpha, lineWidth }) => {
    ctx.beginPath();
    ctx.strokeStyle = color;
    ctx.globalAlpha = alpha || 1;
    ctx.lineWidth = lineWidth || 1.5;
    rounds.forEach((r, i) => {
      const px = xScale(r), py = yScale(data[i]);
      i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
    });
    ctx.stroke();
    ctx.globalAlpha = 1;
  });
}
